:root[data-visualize-standalone] {

.table-responsive > .table :is(th, td) {

  font-size: var(--font-size-tooltip);

.viz-badge {

.text-muted {

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  color: var(--secondary-foreground);

  cursor: var(--cursor-interaction, pointer);

.btn:is(.btn-block, .viz-tile) {

}

a.btn {
  cursor: pointer;

}

.btn:not(:disabled):hover {

}

.btn-primary {
  border-color: transparent;

}

.btn-primary .text-muted {
  color: color-mix(

}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);

}

.btn:disabled {

}

[data-lucide] {

}

.form-label {

  margin-bottom: 6px;

}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {

}

.form-control-color[type="color"] {

}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {

.form-control-color[type="color"]::-webkit-color-swatch {

}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;

}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;

  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),

}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed="true"],
    [aria-selected="true"],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget > svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}
</style>

<div id="camera-lookat-explainer">
  <style>
    #camera-lookat-explainer {
      color: var(--foreground);
      font-size: var(--font-size-base);
      width: 100%;
    }
    #camera-lookat-explainer * { box-sizing: border-box; }
    #camera-lookat-explainer .controls {
      display: grid;

  <div class="controls" aria-label="Parámetros de la cámara">
    <label class="control" for="cam-az">
      <span>Azimut α</span>
      <input id="cam-az" type="range" min="-180" max="180" step="1" value="40">
      <output id="cam-az-out" for="cam-az">40°</output>
    </label>
    <label class="control" for="cam-el">
      <span>Elevación β</span>
      <input id="cam-el" type="range" min="-80" max="80" step="1" value="25">
      <output id="cam-el-out" for="cam-el">25°</output>
    </label>
  </div>

  <div class="grid" style="grid-template-columns: minmax(0, 1fr);">
    <section class="panel" aria-labelledby="lookat-title">
      <div class="panel-title" id="lookat-title">
        <span>Cámara: posición (eye) y sistema {u, v, w}</span><span>setupCamera + lookAt</span>
      </div>
      <svg id="lookat-svg" viewBox="0 -25 360 300" role="img" aria-label="Cámara ubicada en eye con su sistema de coordenadas u, v, w">
        <defs>
          <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted-foreground)"></path></marker>
          <marker id="arrow-forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--viz-series-1)"></path></marker>
          <marker id="arrow-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--viz-series-2)"></path></marker>
          <marker id="arrow-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--viz-series-3)"></path></marker>
          <marker id="arrow-input-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--viz-series-4)"></path></marker>
        </defs>
        <g id="basis-dynamic"></g>
      </svg>
      <div class="formula" id="eye-formula">eye = (2.08, 1.27, 1.74)</div>
      <div class="legend" aria-label="Leyenda de vectores">
        <span class="legend-item"><span class="swatch" style="background:var(--viz-series-1)"></span>−w = normalize(center − eye)</span>
        <span class="legend-item"><span class="swatch" style="background:var(--viz-series-2)"></span>u (derecha)</span>
        <span class="legend-item"><span class="swatch" style="background:var(--viz-series-3)"></span>v (arriba real)</span>

  <script>
    (() => {
      const root = document.getElementById("camera-lookat-explainer");
      const azInput = root.querySelector("#cam-az");
      const elInput = root.querySelector("#cam-el");
      const azOutput = root.querySelector("#cam-az-out");
      const elOutput = root.querySelector("#cam-el-out");
      const eyeFormula = root.querySelector("#eye-formula");
      const basisDynamic = root.querySelector("#basis-dynamic");
      const ns = "http://www.w3.org/2000/svg";
      const radius = 3;

      function svgEl(name, attrs, parent) {
        const node = document.createElementNS(ns, name);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        if (parent) parent.appendChild(node);
        return node;
      }

      function vecSub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
      function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
      function normalize(a) {
        const length = Math.hypot(a[0], a[1], a[2]);
        return a.map(value => value / length);
      }
      function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
      function scale(a, factor) { return a.map(value => value * factor); }

      function project(p, origin = [180, 172], factor = 48) {
        const ry = -34 * Math.PI / 180;
        const rx = 18 * Math.PI / 180;
        const x1 = Math.cos(ry) * p[0] + Math.sin(ry) * p[2];
        const z1 = -Math.sin(ry) * p[0] + Math.cos(ry) * p[2];
        const y1 = Math.cos(rx) * p[1] - Math.sin(rx) * z1;
        return [origin[0] + factor * x1, origin[1] - factor * y1];
      }

      function polyline3D(points, className, parent, origin, factor) {
        const pointsAttr = points.map(point => project(point, origin, factor).map(value => value.toFixed(1)).join(",")).join(" ");
        return svgEl("polyline", { points: pointsAttr, class: className }, parent);
      }

      function line2D(a, b, className, parent, marker) {
        const attrs = { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: className };
        if (marker) attrs["marker-end"] = marker;
        return svgEl("line", attrs, parent);
      }

      function label(point, content, className, parent, anchor = "start") {
        const node = svgEl("text", { x: point[0], y: point[1], class: className || "", "text-anchor": anchor }, parent);
        node.textContent = content;
        return node;
      }

      function eyeFromAngles(az, el) {
        return [
          radius * Math.cos(el) * Math.cos(az),
          radius * Math.sin(el),
          radius * Math.cos(el) * Math.sin(az)
        ];
      }

      function drawGround(origin, factor, parent) {
        const G = 3.2;
        // Plano de piso (plano XZ en y = 0)
        const corners = [[-G, 0, -G], [G, 0, -G], [G, 0, G], [-G, 0, G]]
          .map(p => project(p, origin, factor));
        const polyPts = corners.map(c => c.map(v => v.toFixed(1)).join(",")).join(" ");
        svgEl("polygon", { points: polyPts, class: "ground" }, parent);
        // Grilla del piso
        for (let i = -3; i <= 3; i += 1) {
          polyline3D([[i, 0, -G], [i, 0, G]], "ground-grid", parent, origin, factor);
          polyline3D([[-G, 0, i], [G, 0, i]], "ground-grid", parent, origin, factor);
        }
        // Ejes del mundo
        const o = project([0, 0, 0], origin, factor);
        const xE = project([3.4, 0, 0], origin, factor);
        const yE = project([0, 3.0, 0], origin, factor);
        const zE = project([0, 0, 3.4], origin, factor);
        line2D(o, xE, "axis", parent, "url(#arrow-neutral)");
        line2D(o, yE, "axis", parent, "url(#arrow-neutral)");
        line2D(o, zE, "axis", parent, "url(#arrow-neutral)");
        label([xE[0] + 4, xE[1] + 3], "X", "secondary", parent);
        label([yE[0] + 2, yE[1] - 2], "Y", "secondary", parent);
        label([zE[0] - 2, zE[1] + 13], "Z", "secondary", parent, "middle");
      }

      function updateBasis(eye) {
        basisDynamic.replaceChildren();
        const center3 = [0, 0, 0];
        const worldUp = [0, 1, 0];
        const forward = normalize(vecSub(center3, eye));
        const right = normalize(cross(forward, worldUp));
        const realUp = cross(right, forward);
        const origin = [184, 120];
        const factor = 31;
        const eye2 = project(eye, origin, factor);
        const center2 = project(center3, origin, factor);
        const forwardEnd = project(add(eye, scale(forward, 1.65)), origin, factor);
        const rightEnd = project(add(eye, scale(right, 1.45)), origin, factor);
        const upEnd = project(add(eye, scale(realUp, 1.45)), origin, factor);
        const inputUpEnd = project(add(eye, scale(worldUp, 1.7)), origin, factor);

        // Piso de referencia (plano XZ), ejes del mundo y proyección del eye en el piso
        drawGround(origin, factor, basisDynamic);
        const groundEye2 = project([eye[0], 0, eye[2]], origin, factor);
        line2D(eye2, groundEye2, "ray", basisDynamic);
        svgEl("circle", { cx: groundEye2[0], cy: groundEye2[1], r: 3, class: "center-dot" }, basisDynamic);

        line2D(eye2, center2, "ray", basisDynamic);
        line2D(eye2, forwardEnd, "forward", basisDynamic, "url(#arrow-forward)");
        line2D(eye2, rightEnd, "right", basisDynamic, "url(#arrow-right)");
        line2D(eye2, upEnd, "real-up", basisDynamic, "url(#arrow-up)");
        line2D(eye2, inputUpEnd, "input-up", basisDynamic, "url(#arrow-input-up)");
        svgEl("circle", { cx: eye2[0], cy: eye2[1], r: 7, class: "camera-dot" }, basisDynamic);
        svgEl("circle", { cx: center2[0], cy: center2[1], r: 4, class: "center-dot" }, basisDynamic);
        label([eye2[0] + 8, eye2[1] - 8], "eye", "", basisDynamic);
        label([center2[0] + 6, center2[1] + 15], "center", "secondary", basisDynamic);
        label([forwardEnd[0] + 5, forwardEnd[1]], "−w", "", basisDynamic);
        label([rightEnd[0] + 5, rightEnd[1]], "u", "", basisDynamic);
        label([upEnd[0] + 5, upEnd[1] - 2], "v", "", basisDynamic);
        label([inputUpEnd[0] + 5, inputUpEnd[1] - 2], "up dado", "secondary", basisDynamic);

        const uFormula = label([180, 200], "u = normalize((−w) × up)", "secondary", basisDynamic, "middle");
        uFormula.setAttribute("aria-label", "u es igual al producto vectorial normalizado de menos w por up");
        const vFormula = label([180, 220], "v = u × (−w)", "secondary", basisDynamic, "middle");
        vFormula.setAttribute("aria-label", "v es igual a u por menos w");
      }

      function update() {
        const azDeg = Number(azInput.value);
        const elDeg = Number(elInput.value);
        const az = azDeg * Math.PI / 180;
        const el = elDeg * Math.PI / 180;
        const eye = eyeFromAngles(az, el);
        azOutput.value = `${azDeg}°`;
        elOutput.value = `${elDeg}°`;
        eyeFormula.textContent = `eye = (${eye.map(value => value.toFixed(2)).join(", ")})`;
        updateBasis(eye);
      }

      azInput.addEventListener("input", update);
      elInput.addEventListener("input", update);
      update();
    })();
  </script>
</div>

<script id="codex-visualization-tooltip">/* oxlint-disable typescript/no-unsafe-argument, typescript/no-unsafe-call, typescript/no-unsafe-return */
// Runs inside the visualization sandbox, not the host webview.
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
