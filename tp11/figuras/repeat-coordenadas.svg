<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-labelledby="title desc">
  <title id="title">REPEAT consulta la parte fraccionaria de la coordenada</title>
  <desc id="desc">Corte horizontal del damero con u de 0 a 2. El patrón vuelve a empezar en u igual a 1. Los puntos u igual a 0.25 y u igual a 1.25 señalan la misma posición dentro de sus respectivas copias de la imagen.</desc>
  <defs>
    <pattern id="fila-damero" width="44" height="64" patternUnits="userSpaceOnUse">
      <rect width="44" height="64" fill="#f8e9cf"/>
      <rect x="22" width="22" height="64" fill="#182d43"/>
    </pattern>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#bb5400"/>
    </marker>
  </defs>
  <rect width="900" height="290" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#182d43">
    <text x="28" y="32" font-size="22" font-weight="bold">REPEAT vuelve a empezar la imagen</text>
    <text x="28" y="56" font-size="16" fill="#45566b">Un corte horizontal del damero: u cambia mientras v permanece fijo.</text>
    <g transform="translate(86 113)">
      <rect width="704" height="64" fill="url(#fila-damero)"/>
      <rect width="704" height="64" fill="none" stroke="#bb5400" stroke-width="2"/>
      <path d="M352 0V64" stroke="white" stroke-width="5"/>
      <path d="M352 0V64" stroke="#bb5400" stroke-width="3" stroke-dasharray="8 5"/>
    </g>
    <g font-size="17" text-anchor="middle">
      <text x="86" y="99">0</text><text x="438" y="99">1</text><text x="790" y="99">2</text>
      <text x="821" y="151" font-style="italic">u →</text>
    </g>
    <g stroke="#bb5400" stroke-width="2" fill="none">
      <path d="M174 151V191M526 151V191"/>
      <path d="M504 225C440 264 260 264 196 225" marker-end="url(#flecha)"/>
    </g>
    <g fill="#bb5400" stroke="white" stroke-width="3">
      <circle cx="174" cy="145" r="7"/>
      <circle cx="526" cy="145" r="7"/>
    </g>
    <g text-anchor="middle" font-size="18">
      <text x="174" y="215">u = 0.25</text><text x="526" y="215">u = 1.25</text>
    </g>
    <text x="450" y="280" font-size="16" text-anchor="middle">Ambas consultas llegan al mismo punto de la imagen: su coordenada u es 0.25.</text>
  </g>
</svg>
